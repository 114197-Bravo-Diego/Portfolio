<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Bravo — Portfolio</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%; width: 100%;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            cursor: none;
        }

        #smoke-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.18) 2px,
                rgba(0, 0, 0, 0.18) 4px
            );
        }

        /* Custom cursor */
        #cursor {
            position: fixed;
            width: 20px; height: 20px;
            border: 2px solid #0D7A6E;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: transform 0.08s ease;
            box-shadow: 0 0 8px #0D7A6E;
        }
        #cursor::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #0D7A6E;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Center content */
        .content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 1.5rem;
        }

        .welcome-line {
            color: #0D7A6E;
            font-size: clamp(1.1rem, 3.5vw, 2.2rem);
            letter-spacing: 0.12em;
            text-align: center;
            text-shadow: 0 0 20px #0D7A6E, 0 0 50px rgba(13,122,110,0.35);
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tw-text { display: inline; }

        .caret {
            display: inline-block;
            width: 3px; height: 1.2em;
            background: #0D7A6E;
            margin-left: 5px;
            vertical-align: middle;
            animation: caretBlink 0.7s step-end infinite;
        }

        @keyframes caretBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .subtitle {
            color: rgba(13, 122, 110, 0.45);
            font-size: 0.72rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .subtitle.show { opacity: 1; }

        /* Gamer button — clipped corners */
        .enter-btn {
            position: relative;
            padding: 14px 48px;
            background: transparent;
            color: #0D7A6E;
            border: 0;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 5px;
            cursor: none;
            opacity: 0;
            transition: opacity 0.9s ease, color 0.25s, text-shadow 0.25s;
            clip-path: polygon(14px 0%, 100% 0%, calc(100% - 14px) 100%, 0% 100%);
            outline: none;
        }

        /* Pseudo-border via box shadow on wrapper */
        .enter-btn-wrap {
            position: relative;
            display: inline-block;
            opacity: 0;
            transition: opacity 0.9s ease;
        }
        .enter-btn-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #0D7A6E;
            clip-path: polygon(14px 0%, 100% 0%, calc(100% - 14px) 100%, 0% 100%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .enter-btn-wrap::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: #0D7A6E;
            clip-path: polygon(14px 0%, 100% 0%, calc(100% - 14px) 100%, 0% 100%);
            z-index: -2;
            box-shadow: 0 0 0 2px #0D7A6E;
            transition: box-shadow 0.25s;
        }

        /* Visible outline via outline-wrap trick */
        .btn-outline {
            position: absolute;
            inset: 0;
            pointer-events: none;
            clip-path: polygon(14px 0%, 100% 0%, calc(100% - 14px) 100%, 0% 100%);
            border: 2px solid #0D7A6E;
        }

        .enter-btn-wrap.show { opacity: 1; }

        .enter-btn-wrap:hover::before { opacity: 1; }
        .enter-btn-wrap:hover .enter-btn {
            color: #0a0a0a;
            text-shadow: none;
        }
        .enter-btn-wrap:hover::after {
            box-shadow: 0 0 30px #0D7A6E, 0 0 60px rgba(13,122,110,0.5);
        }

        /* Corner decorations */
        .corner {
            position: fixed;
            width: 40px; height: 40px;
            border-color: rgba(13,122,110,0.4);
            border-style: solid;
            z-index: 20;
        }
        .corner.tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
        .corner.tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
        .corner.bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
        .corner.br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }
    </style>
</head>
<body>
<div id="cursor"></div>
<div class="scanlines"></div>
<div id="smoke-container"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="content">
    <div class="welcome-line">
        <span id="tw-text"></span><span class="caret"></span>
    </div>
    <p class="subtitle" id="subtitle">FULL STACK DEVELOPER</p>
    <div class="enter-btn-wrap" id="enterWrap">
        <div class="btn-outline"></div>
        <button class="enter-btn" id="enterBtn">ENTRAR / ENTER</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // Custom cursor tracking
    const cur = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cur.style.left = e.clientX + 'px';
        cur.style.top  = e.clientY + 'px';
    });

    // Three.js — dense greenish smoke
    (function initSmoke() {
        const scene    = new THREE.Scene();
        const camera   = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 1, 1000);
        camera.position.z = 1000;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.getElementById('smoke-container').appendChild(renderer.domElement);

        const clock = new THREE.Clock();

        scene.add(new THREE.AmbientLight(0x0D7A6E, 0.4));
        const dl = new THREE.DirectionalLight(0x0a2e28, 0.7);
        dl.position.set(0, 1, 1);
        scene.add(dl);

        const tex = new THREE.TextureLoader().load('https://assets.codepen.io/95379/smoke.png');
        const particles = [];

        for (let i = 0; i < 200; i++) {
            const mat = new THREE.MeshLambertMaterial({
                color: i % 3 === 0 ? 0x0a2e28 : 0x071a17,
                map: tex,
                transparent: true,
                opacity: 0.18 + Math.random() * 0.12,
                depthWrite: false
            });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), mat);
            mesh.position.set(
                Math.random() * 700 - 350,
                Math.random() * 700 - 350,
                Math.random() * 900 - 200
            );
            mesh.rotation.z = Math.random() * Math.PI * 2;
            scene.add(mesh);
            particles.push(mesh);
        }

        function animate() {
            requestAnimationFrame(animate);
            const d = clock.getDelta();
            particles.forEach(p => { p.rotation.z += d * (0.08 + p.position.z * 0.00005); });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    })();
</script>
<script src="scriptIni.js"></script>
</body>
</html>
